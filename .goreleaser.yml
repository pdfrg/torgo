version: 2

project_name: torgo

before:
  hooks:
    - go mod tidy

builds:
  - id: torgo
    main: .
    binary: torgo
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: torgo
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]

release:
  draft: true

# NOTE: the default changelog format embeds committer emails — never use it.
# This format intentionally omits all author fields.
changelog:
  use: git
  sort: asc
  format: "* {{ .Message }} ({{ .SHA }})"
  abbrev: 7
