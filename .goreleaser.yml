project_name: torgo

before:
  hooks:
    - go mod tidy

builds:
  - id: torgo
    main: .
    binary: torgo
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: torgo
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format: tar.gz

release:
  draft: true
