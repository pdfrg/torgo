name: Release

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Verify version injection
      run: |
        go build -ldflags "-X main.Version=v0.0.0-test" -o /tmp/torgo-test .
        OUTPUT=$(/tmp/torgo-test --version 2>&1)
        echo "Reported version: $OUTPUT"
        echo "$OUTPUT" | grep -q "v0.0.0-test" || (echo "ERROR: Version injection failed!" && exit 1)

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
