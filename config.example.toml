# torgo Configuration File
# Copy to ~/.config/torgo/config.toml and customize

# ============================================================================
# UI Configuration
# ============================================================================
[ui]
# default_client: Which client to connect to on startup (must match a client's 'id')
default_client = "qbt-local"

# show_hints: Display keybinding hints bar at bottom of screen
show_hints = true

# default_color_scheme: Color theme to use on startup
# Valid options:
#   - "dark": Built-in dark theme (default)
#   - "light": Built-in light theme
#   - "highcontrast": Built-in high-contrast theme
#   - "omarchy": Uses ~/.config/omarchy/current/theme/colors.toml (if it exists)
#   - "custom": Uses ~/.config/torgo/colors.toml (if it exists)
#
# Theme auto-discovery:
#   - If ~/.config/omarchy/current/theme/colors.toml exists, "omarchy" will be available
#   - If ~/.config/torgo/colors.toml exists, "custom" will be available
#   - These can be cycled through using the 't' key in the TUI
#
# Omarchy format colors.toml:
#   - Copy your omarchy theme's colors.toml to ~/.config/torgo/colors.toml to use as "custom"
#   - Or set up omarchy in ~/.config/omarchy/current/theme/ and use "omarchy" option
default_color_scheme = "dark"

# ============================================================================
# Client Configuration
# ============================================================================
# Each [[clients]] block defines a torrent client to connect to.
# You can have multiple clients of each type and switch between them with 'c' key.
#
# Fields displayed in TUI status bar:
#   [status] name host:port
# Example:
#   ✓ Online  Local qBittorrent localhost:8080  🐢▼123 ▲45    23/45 torrents
#   ✓ Online  Work Server 10.0.0.5:6969    12/20 torrents

# qBittorrent Instance 1 (Local)
[[clients]]
# type: REQUIRED - Must be exactly "qbittorrent" or "transmission"
type = "qbittorrent"

# id: REQUIRED - Unique identifier for this client (used internally, shown in status bar)
#    Can be any string, must be unique across all clients
#    Shown in TUI as: [qbt-local] ...
id = "qbt-local"

# name: REQUIRED - Display name shown in TUI status bar and client switcher
#      Can be any descriptive text you prefer
#      Shown in TUI as: ... Local qBittorrent ...
name = "Local qBittorrent"

# host: REQUIRED - Hostname or IP address of the torrent client
host = "localhost"

# port: REQUIRED - Port number the torrent client listens on
port = 8080

# username: OPTIONAL - Username for authentication (empty if client allows anonymous)
username = "admin"

# password: OPTIONAL - Password for authentication
#          Can use environment variables like $QBT_PASS (will be expanded at startup)
password = "admin"

# qBittorrent Instance 2 (Remote)
[[clients]]
type = "qbittorrent"
id = "qbt-remote"
name = "Remote qBittorrent"
host = "192.168.1.50"
port = 8080
username = "user"
password = "your-password-here"

# Transmission Instance 1 (Local)
[[clients]]
type = "transmission"
id = "trans-local"
name = "Local Transmission"
host = "localhost"
port = 6969
username = "transmission"
password = "transmission"

# Transmission Instance 2 (Remote)
[[clients]]
type = "transmission"
id = "trans-remote"
name = "Work Server"
host = "10.0.0.5"
port = 6969
username = "user"
password = "your-password-here"
